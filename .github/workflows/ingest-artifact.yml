name: Ingest incoming artifacts

on:
  push:
    branches: [main]
    paths:
      - 'incoming/**'
      - '!incoming/.gitkeep'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process incoming files
        run: node ingest-incoming.js
        env:
          VERCEL_PROJECT_URL: ${{ secrets.VERCEL_PROJECT_URL }}

      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(ingest): process uploaded artifacts [skip ci]"
            git push origin main
          else
            echo "No new artifacts to commit."
          fi
