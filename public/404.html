<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; script-src 'none'; object-src 'none'; frame-ancestors 'none';">
  <title>Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(17, 18, 25, 0.7);
      --card-border: rgba(255, 255, 255, 0.06);
      --card-border-hover: rgba(255, 255, 255, 0.12);
      --text-primary: #f8fafc;
      --text-secondary: #64748b;
      --glow-color: rgba(99, 102, 241, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      overflow: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    .bg-glows {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .glow-1, .glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
      filter: blur(50px);
    }

    .glow-1 {
      top: -100px;
      left: -100px;
    }

    .glow-2 {
      bottom: -100px;
      right: -100px;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 3rem 2.25rem;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
    }

    .container:hover {
      border-color: var(--card-border-hover);
      transform: translateY(-2px);
      box-shadow: 0 30px 60px rgba(99, 102, 241, 0.05), 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .error-code {
      font-size: 5rem;
      font-weight: 300;
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, #f8fafc 30%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    p.description {
      font-size: 0.925rem;
      color: var(--text-secondary);
      line-height: 1.6;
      font-weight: 400;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      margin: 1.75rem 0;
    }

    p.sub-copy {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.6;
      font-weight: 400;
      font-style: italic;
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.3), transparent);
    }

    @media (max-width: 480px) {
      .container {
        padding: 2.25rem 1.5rem;
        border-radius: 20px;
      }
      .error-code {
        font-size: 4rem;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.15rem;
      }
      p.description, p.sub-copy {
        font-size: 0.85rem;
      }
      .divider {
        margin: 1.25rem 0;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glows">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
  </div>
  <div class="container">
    <div class="scan-line"></div>
    <div class="error-code">404</div>
    <h1>Nothing here</h1>
    <p class="description">This page does not exist, or you do not have the right link.</p>
    <div class="divider"></div>
    <p class="sub-copy">If you expected something here, check the URL and try again.</p>
  </div>
</body>
</html>
